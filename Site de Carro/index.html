<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClearInspect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <h1>ClearInspect</h1>
    <p class="sub">Transparência absoluta na compra do seu carro usado.</p>
    <label class="search">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4-4"/></svg>
      <input id="q" type="text" placeholder="Digite o modelo do carro (ex: Honda Civic 2018)..." autocomplete="off">
    </label>
  </div>
</header>

<main>
  <nav class="tabs" id="tabs" aria-label="Categorias"></nav>
  <div class="head"><h2 id="title"></h2><span class="pill" id="pill"></span></div>
  <section id="list"></section>
</main>

<footer>
  <div class="bar"><i id="fill"></i></div>
  <div class="foot">
    <div><div class="lbl">Saúde geral</div><div class="val" id="health">0% Avaliado</div></div>
    <div class="acts">
      <button class="btn sq" id="fipe" title="Abrir Tabela FIPE" aria-label="Consultar Tabela FIPE">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8.5 6.5h7M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/></svg>
      </button>
      <button class="btn pdf" id="pdf">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
        <span>Relatório PDF</span>
      </button>
    </div>
  </div>
</footer>
<button class="help" aria-label="Ajuda" id="help">?</button>

<script src="script(1).js"></script>
</body>
</html>
